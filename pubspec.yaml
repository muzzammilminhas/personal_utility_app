name: personal_utility_app
description: >
  A Personal Utility App with QR Business Card, Unit Converter,
  and Audio Recorder. Built with Flutter + Supabase + Provider.
  5th-Semester Mobile Application Development Project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────
  provider: ^6.1.2

  # ── Backend (Auth + Database + Storage) ───────────────────
  supabase_flutter: ^2.5.6

  # ── Part 3: QR Business Card ──────────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # ── Part 5: Audio Recorder ────────────────────────────────
  # record v6 is built for record_platform_interface v1.5.x
  # record v5 was incompatible with the new interface → build error
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.3
  uuid: ^4.4.0

  # ── Utilities ─────────────────────────────────────────────
  intl: ^0.20.2
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F7FBFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#F7FBFF"
    theme_color: "#2F80ED"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
